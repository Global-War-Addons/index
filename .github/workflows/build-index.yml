# The central CI of the catalog (11-catalog-distribution.md 4.2; 15-merge-implementation.md 7.2 steps 1-4):
# new releases of the addon repos -> validator -> files/<id>/<ver>.json (+ <ver>.merge.json), state/, history/,
# index.json. Commits only when something changed.
#
# Two jobs (review F3). `check` reads the untrusted packages (the validator, zipfile, gw_merge on the texts of an author)
# and holds no secret and no token that writes: GITHUB_TOKEN with contents: read (or the token of a read-only App),
# the issues it would open go to an outbox. `publish` runs no code of a package: it checks the hand-over of `check`
# (apply-changes: the generated files only, and every new package asset it names is downloaded again and hashed - the
# sha256 of `check` is not taken on trust), opens the issues (publish-issues: a marker in the body, an open issue of the
# bot is not opened again) and pushes with an App token that writes only to this repo. The key of that App is a secret
# of the environment `catalog-publish` (deployment branches: the default branch only), so no other branch and no other
# job can read it.
#
# Polling (decision 63, no App "dispatch" in the addon repos): every 15 minutes. A run over an organization that did not
# change is cheap: the lists of repos and releases and the commits of the branches are read with If-None-Match against
# the answers of the last run (an HTTP cache; 304 costs no rate limit), catalog/ is read only on a new commit (review F8),
# no package is downloaded for a version already checked, a retry waits at least 25 minutes, and `publish` is skipped
# when the hand-over is empty. The run at minute 0 goes without the HTTP cache and only an entry of the same hour is
# restored: whatever an earlier run left there is dropped at least once an hour. Moderators start a run by hand
# (workflow_dispatch, `only` = some addons).
name: build-index

on:
  schedule:
    - cron: "0 * * * *"           # without the HTTP cache
    - cron: "15,30,45 * * * *"    # with the HTTP cache
  workflow_dispatch:
    inputs:
      only:
        description: "Comma list of addon ids (empty - all)"
        required: false
        default: ""

# A full run and a run for some addons (only=<id>) have their own groups: GitHub keeps one pending run per group and a
# newer one replaces it, so a manual run of one addon does not push the pending full cron run out of the queue (review
# F9). Both may run at once: ci/commit.sh rebases on a race; a conflict fails the run (the next one repeats the work)
# and the issues are not doubled (publish-issues finds them by their marker).
concurrency:
  group: build-index-${{ inputs.only && 'only' || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # a dispatch may name any branch: there the workflow file and its actions are not reviewed yet
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      work: ${{ steps.handover.outputs.work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Optional: an App with only Contents: read and Metadata: read (a higher rate limit of the API than GITHUB_TOKEN,
      # 1000 requests an hour). Its key is in this job: give that App nothing else
      - name: Read-only App token
        id: reader
        if: ${{ vars.CATALOG_READER_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CATALOG_READER_APP_ID }}
          private-key: ${{ secrets.CATALOG_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"   # zstd zip parts (11 section 3.4) need zipfile of 3.14
      # The snapshots are checked by their sha256 of game_releases.ltx (review F13): an old copy of the cache is dropped
      - name: Snapshots cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gw_snapshots
          key: snapshots-${{ hashFiles('game_releases.ltx') }}
          restore-keys: snapshots-
      # The answers of the GitHub API of the last run with their ETags. An entry is used only when GitHub answers 304 to
      # its ETag; not restored at minute 0 and on a run by hand. The key carries the hour (UTC): only an entry saved in
      # the same hour is restored, so a file written by a run taken over by a package lives at most until the end of
      # the hour even when the run at minute 0 fails (it saves nothing then, and `restore-keys: http-` would restore the
      # old entry again and again)
      - name: HTTP cache key
        id: http
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - name: HTTP cache
        if: ${{ github.event_name == 'schedule' && github.event.schedule != '0 * * * *' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gw_http_cache
          key: http-${{ steps.http.outputs.hour }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: http-${{ steps.http.outputs.hour }}-
      # gw_merge for Linux (xray-16/src/utils/gw_merge): the delta is made only by it (15 section 7.1). vars.GW_MERGE_URL
      # - a tar.gz / binary built by the CI of the engine, used only with the sha256 of vars.GW_MERGE_SHA256 (review F4).
      # Without it a version that replaces text files of the base waits (merge_plan_unavailable: the validator has no
      # Python fallback of the merge rules, decision 64 item 4).
      - name: gw_merge
        id: merge
        env:
          URL: ${{ vars.GW_MERGE_URL }}
          SHA256: ${{ vars.GW_MERGE_SHA256 }}
        run: |
          path=$(bash ci/fetch_gw_merge.sh "$URL" "$SHA256" "$HOME/gw_merge")
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Build the index
        env:
          GITHUB_TOKEN: ${{ steps.reader.outputs.token || github.token }}
          ONLY: ${{ inputs.only || '' }}
          GW_MERGE: ${{ steps.merge.outputs.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/handover" ~/gw_http_cache
          args=(--index . --snapshots ~/gw_snapshots --summary "$RUNNER_TEMP/handover/summary.json"
                --issues-out "$RUNNER_TEMP/handover/issues.json" --http-cache ~/gw_http_cache/github.json)
          if [ -n "$GW_MERGE" ]; then args+=(--gw-merge "$GW_MERGE"); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python tools/validator/gw_catalog.py build-index "${args[@]}"
      # only a scheduled run: a run by hand (`only`) reads a few repos, its entry would replace the full one of the hour
      - name: Save the HTTP cache
        if: ${{ success() && github.event_name == 'schedule' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gw_http_cache
          key: http-${{ steps.http.outputs.hour }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/handover/summary.json" ]; then
            { echo '```json'; cat "$RUNNER_TEMP/handover/summary.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # work=false: nothing changed and no issue to open - `publish` does not run (no token, no deployment record)
      - name: Hand over
        id: handover
        run: |
          python tools/validator/gw_catalog.py export-changes --index . --out "$RUNNER_TEMP/handover"
          work=$(python -c 'import json, sys; c = json.load(open(sys.argv[1])); i = json.load(open(sys.argv[2]))
          print("true" if c["changed"] or c["deleted"] or i["issues"] else "false")' \
            "$RUNNER_TEMP/handover/changes.json" "$RUNNER_TEMP/handover/issues.json")
          echo "work=$work" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.handover.outputs.work == 'true' }}
        with:
          name: handover
          path: ${{ runner.temp }}/handover
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: check
    if: ${{ needs.check.outputs.work == 'true' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # The secret CATALOG_APP_PRIVATE_KEY lives in this environment (no reviewers: it runs every 15 minutes; deployment
    # branches: the default branch only)
    environment: catalog-publish
    runs-on: ubuntu-latest
    # apply-changes downloads the new package assets again (up to a few GB a version)
    timeout-minutes: 120
    steps:
      - name: Repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      # Contents: write on this repo only (the push)
      - name: App token (index)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
      # Issues only: the reports in the addon repos, the reviews in this repo
      - name: App token (issues)
        id: issues
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
      # The same commit as `check` (github.sha): the hand-over is made against it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handover
          path: ${{ runner.temp }}/handover
      # Checks the hand-over and downloads every package asset it adds to state/, history/ or index.json from the
      # address the launcher downloads: size and sha256 are computed here (streamed, nothing unpacked or parsed)
      - name: Apply the hand-over
        run: python tools/validator/gw_catalog.py apply-changes --index . --from "$RUNNER_TEMP/handover"
      - name: Issues
        env:
          GITHUB_TOKEN: ${{ steps.issues.outputs.token }}
          BOT: ${{ steps.issues.outputs.app-slug }}[bot]
        run: |
          python tools/validator/gw_catalog.py publish-issues --index . \
            --outbox "$RUNNER_TEMP/handover/issues.json" --bot-login "$BOT"
      - name: Check
        run: python tools/validator/gw_catalog.py check-index .
      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
          BOT_NAME: ${{ vars.CATALOG_BOT_NAME || 'gw-catalog[bot]' }}
          BOT_EMAIL: ${{ vars.CATALOG_BOT_EMAIL || 'gw-catalog-bot@users.noreply.github.com' }}
        run: |
          bash ci/commit.sh "index: build $(date -u +%Y-%m-%dT%H:%MZ)" index.json state files history
